<div class="border-bottom px-3 py-2 d-flex justify-content-between align-items-center">
    <h4 class="m-0">Works</h4>

    <a class="btn btn-success rounded-0 py-0" href="/works/add">
        Add
    </a>
</div>

{{if .Auth.Error}}
<div class="alert alert-danger rounded-0 border-0 text-center fw-bold mb-0">
    {{.Auth.Error}}
</div>
{{end}}

<div class="table-responsive">

    <table class="table table-hover mb-0">

        <thead class="table-light">
            <tr>
                <th>Cover</th>
                <th>Title</th>
                <th>Source</th>
                <th>IDs</th>
                <th>Date</th>
                <th></th>
            </tr>
        </thead>

        <tbody>

        {{range .Dto}}

            <tr>

                <td class="align-middle">
                    <img 
                        src="https://t4.nhentai.net/{{.Banner}}"
                        style="width:50px;height:70px;object-fit:cover;"
                    >
                </td>

                <td class="align-middle">
                    <a href="/works/{{.Id}}" class="text-decoration-none">
                        <b>{{.Title}}</b>
                    </a>
                    <br>
                    <small class="text-muted">
                        {{.From}}
                    </small>
                    <br>
                    <span>
                        🤍 {{.NhLikes}}
                    </span>
                </td>

                <td class="align-middle">

                    <a href="https://nhentai.net/g/{{.NhId}}/" target="_blank">
                        nhentai
                    </a>

                    <br>

                    <a href="https://e-hentai.org/g/{{.EhId}}/" target="_blank">
                        e-hentai
                    </a>

                </td>

                <td class="align-middle">
                    <small>
                        NH: {{.NhId}}
                        <br>
                        EH: {{.EhId}}
                    </small>
                </td>

                <td class="align-middle">
                    {{.Date.Format "2006-01-02 15:04:05"}}
                </td>

                <td class="align-middle text-end">

                    <a 
                        class="btn btn-secondary rounded-0 py-0"
                        href="/works/edit/{{.Id.Hex}}">
                        Edit
                    </a>

                    <a 
                        class="btn btn-danger rounded-0 py-0"
                        href="/works/delete/{{.Id.Hex}}">
                        Delete
                    </a>

                </td>

            </tr>

        {{end}}

        </tbody>

    </table>

</div>
