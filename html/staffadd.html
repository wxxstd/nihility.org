<div class="border-bottom px-3 py-2">
    <h4 class="m-0">Add Staff</h4>
</div>

<form method="post" enctype="multipart/form-data">

    <div class="border-bottom p-3">

        <label class="form-label fw-bold">
            Nickname
        </label>

        <input
            type="text"
            name="form[nick]"
            class="form-control rounded-0"
            required>

    </div>


    <div class="row g-0 border-bottom">

        <div class="col-md-6 p-3 border-end">

            <label class="form-label fw-bold">
                Discord
            </label>

            <input
                type="text"
                name="form[discord]"
                class="form-control rounded-0">

        </div>

        <div class="col-md-6 p-3">

            <label class="form-label fw-bold">
                Email
            </label>

            <input
                type="email"
                name="form[email]"
                class="form-control rounded-0">

        </div>

    </div>


    <div class="border-bottom p-3">

        <label class="form-label fw-bold">
            Existing Avatar
        </label>

        <div class="d-flex flex-wrap gap-2">

            {{range $i, $img := .Dto.Artifacts}}

            <input
                class="btn-check"
                type="radio"
                name="form[avatar]"
                id="avatar{{$i}}"
                value="{{$img}}"
                autocomplete="off">

            <label
                class="btn btn-outline-secondary rounded-0 p-1"
                for="avatar{{$i}}">

                <img
                    src="{{$img}}"
                    style="width:80px;height:80px;object-fit:cover;">

            </label>

            {{end}}

        </div>

    </div>


    <div class="border-bottom p-3">

        <label class="form-label fw-bold">
            Or Upload Avatar
        </label>

        <input
            type="file"
            name="avatar"
            accept="image/*"
            class="form-control rounded-0">

        <div class="form-text">
            Uploading a file overrides the selected avatar.
        </div>

    </div>


    <div class="border-bottom p-3">

        <label class="form-label fw-bold">
            Roles
        </label>

        <div class="d-flex flex-wrap gap-2">

            {{range .Dto.Roles}}

            <input
                class="btn-check"
                type="checkbox"
                name="form[roles]"
                value="{{.Id.Hex}}"
                id="role{{.Id.Hex}}">

            <label
                class="btn rounded-0"
                style="background: {{.Color}}"
                for="role{{.Id.Hex}}">

                {{.Name}}

            </label>

            {{end}}

        </div>

    </div>


    <div class="p-3 d-flex justify-content-between">

        <a
            href="/staff"
            class="btn btn-secondary rounded-0">
            Cancel
        </a>

        <button
            type="submit"
            class="btn btn-success rounded-0">
            Create Staff
        </button>

    </div>

</form>
