<div class="container-fluid px-0" style="width: 400px; margin-top: 100px">

    <div class="border-bottom px-3 py-2">
        <h4 class="m-0">Register</h4>
    </div>

    {{if .Auth.Error}}
    <div class="alert alert-danger rounded-0 border-0 text-center fw-bold mb-0">
        {{.Auth.Error}}
    </div>
    {{end}}

    <form method="post">

        <div class="border-bottom p-3">
            <label class="form-label fw-bold">Username</label>
            <input
                    type="text"
                    id="form_userUsername"
                    name="form[userUsername]"
                    required
                    placeholder="Username"
                    class="form-control rounded-0"
                    value="{{.Dto.Nick}}"
                    >
        </div>

        <div class="border-bottom p-3">
            <label class="form-label fw-bold">Password</label>
            <input
                    type="password"
                    id="form_userPassA"
                    name="form[userPassA]"
                    required
                    autocomplete="new-password"
                    placeholder="Password"
                    class="form-control rounded-0">
        </div>

        <div class="border-bottom p-3">
            <label class="form-label fw-bold">Confirm Password</label>
            <input
                    type="password"
                    id="form_userPassB"
                    name="form[userPassB]"
                    required
                    autocomplete="new-password"
                    placeholder="Password Again"
                    class="form-control rounded-0">
        </div>

        <div class="p-3 d-flex justify-content-between align-items-center">

            <button
                    type="submit"
                    id="form_Register"
                    name="form[Register]"
                    class="btn btn-primary rounded-0 w-100">
                Register
            </button>

        </div>

    </form>

</div>
