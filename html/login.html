<div class="container-fluid px-0" style="width: 400px; margin-top: 100px">

    <div class="border-bottom px-3 py-2">
        <h4 class="m-0">Login</h4>
    </div>

    {{if .Auth.Error}}
    <div class="alert alert-danger rounded-0 border-0 text-center fw-bold mb-0">
        {{.Auth.Error}}
    </div>
    {{end}}


    <form method="post">

        <div class="border-bottom p-3">
            <label class="form-label fw-bold">Username</label>
            <input
                type="text"
                id="form_userName"
                name="form[userName]"
                required
                placeholder="Username"
                class="form-control rounded-0">
        </div>

        <div class="border-bottom p-3">
            <label class="form-label fw-bold">Password</label>
            <input
                type="password"
                id="form_userPass"
                name="form[userPass]"
                required
                autocomplete="current-password"
                placeholder="Password"
                class="form-control rounded-0">
        </div>

        <div class="p-3 d-flex justify-content-between align-items-center">

            <button
                type="submit"
                id="form_Bejelentkezés"
                name="form[Login]"
                class="btn btn-primary rounded-0 w-100">
                Login
            </button>

        </div>

    </form>

</div>
