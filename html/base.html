<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
    <head>
        <meta property="og:title" content="Nihility">
        <meta property="og:type" content="website">
        <meta property="og:url" content="https://nihility.org/">
        <meta property="og:image" content="https://nihility.org/assets/images (1) copy.png">
        <meta property="og:description" content="Another random translation site.">
        <meta name="theme-color" content="#FFFFFF">

        <meta charset="UTF-8">
        <title>Nihility</title>

        <link rel="icon" type="image/x-icon" href="/images (1) copy.png">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Nerko+One&display=swap" rel="stylesheet">

        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
        <link href="/basic.css" rel="stylesheet">
    </head>
    <body>
        {{if .Auth.Username}}
        <div class="bg-dark w-100 d-flex justify-content-between">
            <div class="ms-2">
                <a class="btn btn-secondary py-0 rounded-0" role="button" href="/logout">logout</a>
                <a class="btn btn-danger py-0 rounded-0" role="button" href="/user/{{.Auth.Username}}">{{.Auth.Username}}</a>
            </div>
            <div class="me-2">
                <a class="btn btn-secondary py-0 rounded-0" role="button" href="/works">works</a>
                <a class="btn btn-secondary py-0 rounded-0" role="button" href="/staff">staff</a>
                <a class="btn btn-secondary py-0 rounded-0" role="button" href="/roles">staff</a>
                <a class="btn btn-light py-0 rounded-0" role="button" href="/">back</a>
            </div>
        </div>
        {{end}}
        <main role="main" class="flex-fill w-100">
            {{.Main}}
        </main>
    </body>
</html>
