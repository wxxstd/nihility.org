<div class="border-bottom px-3 py-2">
    <h4 class="m-0">Register Invite</h4>
</div>


<div class="p-3">

    <div class="d-flex align-items-center mb-4">

        <img
            src="{{.Dto.Staff.Avatar}}"
            class="me-3"
            style="width:80px;height:80px;object-fit:cover;">

        <div>

            <h5 class="mb-1">
                {{.Dto.Staff.Nick}}
            </h5>

            <div class="text-muted">
                {{.Dto.Staff.Discord}}
            </div>

        </div>

    </div>


    <label class="form-label fw-bold">
        Register SHA
    </label>

    <div class="input-group">

        <input
            id="registerLink"
            type="text"
            readonly
            value="{{.Dto.Sha.Sha}}"
            class="form-control rounded-0">


        <button
            class="btn btn-secondary rounded-0"
            onclick="navigator.clipboard.writeText('nihility.org/register/{{.Dto.Sha.Sha}}')">
            Copy
        </button>

    </div>


    <div class="mt-3">

        <label class="form-label fw-bold">
            Register URL
        </label>

        <input
            type="text"
            readonly
            value="/register/{{.Dto.Sha.Sha}}"
            class="form-control rounded-0">

    </div>

</div>
